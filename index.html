<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F5F6F8">
<meta name="description" content="CashSight learns how late each customer really pays and shows the week your cash runs short, before it comes.">
<title>CashSight</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F766E'/%3E%3Cpath d='M7 20l6-6 4 4 8-8' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
/* Theme before first paint: saved choice wins, else device setting. */
(function(){
  var theme = null;
  try { theme = localStorage.getItem("cashsight.theme"); } catch(e){}
  if (theme !== "light" && theme !== "dark"){
    theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", theme);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "dark" ? "#0B0E13" : "#F5F6F8");
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ---------- colour tokens: every colour lives here ---------- */
:root, [data-theme="light"]{
  --bg:#F5F6F8; --card:#FFFFFF; --card-2:#F7F8FA; --track:#ECEEF2; --border:#E4E7EC; --border-strong:#CDD2DA;
  --text:#101828; --text-2:#344054; --muted:#5B6472;
  --accent:#0F766E; --accent-hover:#115E59; --on-accent:#FFFFFF; --accent-soft:#E6F4F2;
  --red:#B42318; --red-bg:#FEF3F2; --red-border:#FDA29B; --red-soft-text:#B42318;
  --green:#067647; --green-bg:#ECFDF3; --green-border:#75E0A7;
  --amber-text:#93370D; --amber-bg:#FEF0C7;
  --tag-red-text:#B42318; --tag-red-bg:#FEE4E2;
  --row-short:#FEF3F2; --focus:#0F766E;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --shadow-pop:0 1px 2px rgba(16,24,40,.08), 0 2px 6px rgba(16,24,40,.08);
  --chart-grid:#EEF0F3; --chart-tick:#5B6472;
  --chart-in:rgba(6,118,71,.42); --chart-out:rgba(217,45,32,.34);
  --chart-real:#0F766E; --chart-real-fill:rgba(15,118,110,.10);
  --chart-due:#667085; --chart-buffer:#D92D20; --chart-belowzero:rgba(217,45,32,.06);
  color-scheme: light;
}
[data-theme="dark"]{
  --bg:#0B0E13; --card:#13181F; --card-2:#1A2029; --track:#0F1318; --border:#232A35; --border-strong:#364152;
  --text:#F2F4F7; --text-2:#D0D5DD; --muted:#A4ADBB;
  --accent:#2DD4BF; --accent-hover:#5EEAD4; --on-accent:#032420; --accent-soft:#0F2A28;
  --red:#FF7A70; --red-bg:#2B1416; --red-border:#7A2A2A; --red-soft-text:#FFB4AB;
  --green:#4ADE80; --green-bg:#0E2418; --green-border:#1F5C3A;
  --amber-text:#FCD34D; --amber-bg:#2E230D;
  --tag-red-text:#FFB4AB; --tag-red-bg:#3D1719;
  --row-short:#26151A; --focus:#5EEAD4;
  --shadow:0 1px 2px rgba(0,0,0,.45);
  --shadow-pop:0 1px 2px rgba(0,0,0,.5), 0 4px 12px rgba(0,0,0,.35);
  --chart-grid:#1E252F; --chart-tick:#A4ADBB;
  --chart-in:rgba(52,211,153,.62); --chart-out:rgba(255,122,112,.58);
  --chart-real:#2DD4BF; --chart-real-fill:rgba(45,212,191,.14);
  --chart-due:#B3BCC9; --chart-buffer:#FF7A70; --chart-belowzero:rgba(255,122,112,.08);
  color-scheme: dark;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:28px 24px 64px}
section{margin-top:20px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--border);padding:22px 24px}
[data-theme="light"] .card{border-color:transparent}
h1{font-size:22px;line-height:1.2;margin:0;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 14px;font-weight:650;letter-spacing:-.005em}
.muted{color:var(--muted)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.subtitle{color:var(--muted);margin:2px 0 0;font-size:14px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* segmented control: a quiet track, the chosen option lifts */
.seg{display:inline-flex;background:var(--track);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;
  min-height:34px;min-width:40px;padding:0 12px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button:hover{color:var(--text)}
.seg button.active{background:var(--card);color:var(--text);box-shadow:var(--shadow-pop)}
.seg button svg.i{width:16px;height:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:14px;font-weight:600;
  min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;
  transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--border-strong);background:var(--card-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--card-2);border-color:var(--border)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.icon{width:36px;padding:0;min-height:36px}
.btn.done{color:var(--green);border-color:var(--green-border);background:var(--green-bg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--text);background:var(--card-2);border:1px solid var(--border);border-radius:10px}
.field input,.field select{font-size:14px;min-height:42px;padding:0 12px;width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--border-strong)}
::placeholder{color:var(--muted)}

/* ---------- summary ---------- */
.summary{display:flex;gap:14px;align-items:flex-start;border-left:4px solid var(--green)}
.summary.bad{border-left-color:var(--red)}
.summary .badge{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--green-bg);color:var(--green)}
.summary.bad .badge{background:var(--red-bg);color:var(--red)}
.summary .badge svg.i{width:20px;height:20px}
.summary .line{margin:0 0 4px;color:var(--text-2)}
.summary .line:first-child{font-size:17px;font-weight:650;color:var(--text)}
.summary .note{font-size:12px;color:var(--muted);margin-top:6px}

/* ---------- KPI cards ---------- */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi .label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.kpi .big{font-size:30px;line-height:1.15;font-weight:750;margin:8px 0 6px;white-space:nowrap;letter-spacing:-.02em}
.kpi .sub{font-size:13px;color:var(--muted)}
.neg{color:var(--red)}

/* ---------- warnings ---------- */
.warning{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--red-bg);color:var(--red-soft-text);border:1px solid var(--red-border);margin-top:8px;font-weight:500}
.warning svg.i{margin-top:3px}
.warning.info{background:var(--accent-soft);color:var(--text-2);border-color:transparent}
.warning.info svg.i{color:var(--accent)}
.warnings-more,.btn.more{margin-top:10px}
.summary.pending{border-left-color:var(--accent)}
.summary.pending .badge{background:var(--accent-soft);color:var(--accent)}
.warning.ok{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}

/* ---------- chart ---------- */
.chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.chart-head h2{margin:6px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:550;color:var(--text-2);
  background:var(--card-2);border:1px solid var(--border);border-radius:999px;min-height:32px;padding:0 12px 0 10px;cursor:pointer}
.legend button:hover{border-color:var(--border-strong)}
.legend button[aria-pressed="false"]{opacity:.45}
.legend button[aria-pressed="false"] span.lbl{text-decoration:line-through}
.legend svg{width:26px;height:12px;flex:none;overflow:visible}
#chartBox{height:340px;position:relative}

/* ---------- lists ---------- */
.chase-item{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.chase-item:last-child{border-bottom:0;padding-bottom:0}
.chase-item .btn{white-space:nowrap;flex:none}
.chase-item:first-child{padding-top:0}
.chase-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chase-top strong{font-weight:650}
.chase-top .amt{font-weight:650}
.chase-meta{font-size:13px;color:var(--muted);margin-top:3px}
.chase-meta .sep{opacity:.5;margin:0 6px}
.rank{width:26px;height:26px;border-radius:8px;background:var(--card-2);border:1px solid var(--border);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none;color:var(--text-2)}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--amber-bg);color:var(--amber-text)}
.tag.red{background:var(--tag-red-bg);color:var(--tag-red-text)}

/* ---------- what-if ---------- */
.whatif{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto auto;gap:12px;align-items:end}
.whatif-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.whatif-head h2{margin:0}
.whatif-tag{display:none;font-size:12px;font-weight:650;padding:3px 10px;border-radius:999px;background:var(--amber-bg);color:var(--amber-text)}
.whatif-tag.on{display:inline-flex}
.preview{margin-top:12px;font-size:14px;color:var(--text-2);min-height:21px}
.preview b{color:var(--text)}
.preview .up{color:var(--green);font-weight:650}
.preview .down{color:var(--red);font-weight:650}

/* ---------- tables ---------- */
.tablebox{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--card-2)}
th:first-child{border-top-left-radius:8px} th:last-child{border-top-right-radius:8px}
tbody tr:last-child td{border-bottom:0}
td.right,th.right{text-align:right}
td.right{font-variant-numeric:tabular-nums}
tr.short td{background:var(--row-short)}
td input,td select{font-size:13px;min-height:36px;padding:0 10px;width:112px}
td input.wide{width:210px}
td select{width:84px}

/* ---------- data panel ---------- */
.disclosure{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;padding:0;
  font:inherit;font-size:15px;font-weight:650;color:var(--text);cursor:pointer;min-height:40px}
.disclosure .chev{transition:transform .2s;color:var(--muted)}
.disclosure[aria-expanded="true"] .chev{transform:rotate(180deg)}
.inputs{display:grid;grid-template-columns:repeat(3,minmax(0,220px));gap:14px;margin-top:16px}
.toolbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
textarea#csvBox{width:100%;padding:12px;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-height:96px;resize:vertical}
.skipnote{font-size:13px;color:var(--red);margin-top:10px;display:none}
.subhead{font-size:13px;font-weight:650;margin:22px 0 8px;color:var(--text-2)}

/* ---------- starting point ---------- */
.start-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.start-head h2{margin:0}
.hint{font-size:12px;font-weight:650;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.start .inputs{margin-top:0}
.start.attention{border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.money{position:relative}
.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted);pointer-events:none}
.money input{padding-left:42px!important;font-variant-numeric:tabular-nums}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
/* ---------- header actions, banner, import status ---------- */
.actions{display:flex;gap:8px}
.btn.danger{color:var(--red)}
.banner,.status{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow)}
.banner{background:var(--accent-soft);border-color:transparent}
.banner-icon,.status-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--card);color:var(--accent)}
.banner-icon svg.i,.status-icon svg.i{width:18px;height:18px}
.banner-text{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px;color:var(--text-2)}
.banner-text strong{color:var(--text);font-size:14px}
.banner-actions{display:flex;gap:8px;flex-wrap:wrap}
.status-body{flex:1;min-width:0;font-size:14px}
.status-text{color:var(--text-2);margin-top:2px}
.status-text .chip{display:inline-flex;align-items:center;gap:6px;margin:6px 6px 0 0;padding:3px 10px;border-radius:999px;background:var(--card-2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text-2)}
.status-text .chip b{color:var(--text)}
.status.ok .status-icon{background:var(--green-bg);color:var(--green)}
.status.err .status-icon{background:var(--red-bg);color:var(--red)}
[hidden]{display:none!important}

/* ---------- import ---------- */
.dropzone{display:flex;align-items:center;gap:14px;padding:18px;border:1.5px dashed var(--border-strong);border-radius:12px;background:var(--card-2);cursor:pointer;transition:border-color .15s,background .15s}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone .dz-icon{width:28px;height:28px;color:var(--accent);stroke-width:1.75}
.dropzone strong{font-size:14px}
.dz-sub{font-size:13px;color:var(--muted)}
.import-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.import-label{font-size:12px;font-weight:600;color:var(--muted)}
details.paste{margin-top:18px}
details.paste summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2);padding:6px 0}
details.paste textarea{margin-top:8px}

#clipboardBox{display:none;margin-top:12px}
#clipboardBox textarea{width:100%;min-height:90px;padding:10px;font-size:13px}
.foot{display:flex;flex-direction:column;gap:4px;margin-top:28px;font-size:13px}
#selfTest{display:inline-flex;align-items:center;gap:6px;font-weight:600}
#selfTest.pass{color:var(--green)}
#selfTest.fail{color:var(--red);white-space:pre-wrap}
#footnote{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:20px 0}

/* ---------- responsive ---------- */
/* ---------- layout v2: the chart is the hero ---------- */
.wrap{display:flex;flex-direction:column}
.wrap > *{margin-top:16px;min-width:0}
.duo > *{min-width:0}
.wrap > header{margin-top:0}
section{margin-top:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.summary{padding:16px 20px;align-items:center}
.summary .line{margin:0;font-size:14px}
.summary .line:first-child{font-size:16px;margin-bottom:2px}
.summary .lines-rest{color:var(--text-2);font-size:14px}
.summary .note{margin-top:4px}
.kpi{padding:16px 20px}
.kpi .big{font-size:28px;margin:6px 0 4px}
.chartcard{padding-bottom:18px}
#chartBox{height:360px}
.startbar{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--card-2);border:1px solid var(--border)}
.startbar .start-head{margin-bottom:10px}
.start-title{font-size:13px;font-weight:650;color:var(--text-2)}
.startbar .inputs{margin-top:0}
.startbar.attention{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.warnwrap:empty{display:none}
.warnwrap .warning:first-child{margin-top:12px}
.duo{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.whatif-intro{margin:-6px 0 14px;font-size:13px;color:var(--muted)}
.whatifcard .whatif{display:grid;grid-template-columns:1fr;gap:12px}
.whatifcard .whatif .field.inv{grid-column:auto}
.wi-btns{display:flex;gap:8px}
.wi-btns .btn{flex:1}
@media (max-width:980px){ .duo{grid-template-columns:1fr} }
@media (max-width:760px){
  .wrap > *{order:10}
  .wrap > header{order:1} #demoBanner{order:2} #importStatus{order:3} #summarySection{order:4}
  #chartCard{order:5} #kpiCards{order:6} .duo{order:7}
  .wrap > footer{order:20}
  #chartBox{height:280px}
  .summary{padding:14px 16px}
  .banner #demoText{display:none}
  .banner{gap:10px;padding:12px 14px}
  .banner-icon{display:none}
  .startbar{padding:12px}
  .subtitle{font-size:13px}
  .summary .badge{display:none}
  .summary .note{display:none}
  .summary .line:first-child{font-size:15px}
  .summary .line{font-size:13px}
  .chart-head{flex-direction:column;align-items:stretch;gap:8px;margin-bottom:8px}
  .chart-head h2{margin:0}
  .chart-head > *{min-width:0}
  .chart-head .legend{align-self:stretch;width:calc(100% + 32px);max-width:none}
  .legend{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;min-width:0}
  .legend::-webkit-scrollbar{display:none}
  .legend button{flex:none;font-size:12px;min-height:30px;padding:0 10px 0 8px}
  .legend svg{width:20px}
}
@media (max-width:760px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} .kpi .big{font-size:22px} .kpi .sub{font-size:12px} .kpi{padding:14px} }

@media (max-width:900px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){
  .wrap{padding:18px 14px 48px}
  .card{padding:18px 16px}
  .topbar{align-items:flex-start}
  .controls{width:100%;justify-content:space-between}
  .whatif{grid-template-columns:1fr 1fr}
  .whatif .field.inv{grid-column:1 / -1}
  #chartBox{height:270px}
  .kpi .big{font-size:26px}
  .summary .line:first-child{font-size:16px}
  .summary .line{font-size:14px}
  .chase-item{flex-direction:column;align-items:stretch;gap:10px}
  .chase-item .btn{align-self:flex-start}
  .inputs{grid-template-columns:1fr 1fr}
  .start .field:last-child{grid-column:1 / -1}
  .banner,.status{flex-wrap:wrap}
  .banner-actions{width:100%}
  .actions{order:3;width:100%}
  .actions .btn{flex:1}
}
@media (max-width:420px){
  .btn-label-hide{display:none}
  .banner-actions .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

<script id="engine-script">
/* ============================================================
   ENGINE — pure functions, no DOM. All maths in UTC.
   ============================================================ */

function utcDate(s){ return new Date(s + "T00:00:00Z"); }
function isoOf(d){ return d.toISOString().slice(0,10); }
function dayDiff(a, b){ return Math.round((utcDate(a) - utcDate(b)) / 86400000); }
function addDays(s, n){ return isoOf(new Date(utcDate(s).getTime() + n * 86400000)); }

function fmtMoney(n){
  const sign = n < 0 ? "-" : "";
  const abs = Math.abs(Math.round(n));
  return sign + "RM " + abs.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}
function fmtDateShort(s){
  const d = utcDate(s);
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getUTCDate() + " " + months[d.getUTCMonth()];
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function isValidDateStr(s){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const d = utcDate(s);
  return !isNaN(d.getTime()) && isoOf(d) === s;
}

/* Split one CSV line into fields, honouring quotes: commas inside quotes,
   doubled quotes "" inside quotes, then trim each field. */
function splitCSVLine(line){
  const fields = [];
  let cur = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++){
    const ch = line[i];
    if (inQuotes){
      if (ch === '"'){
        if (line[i + 1] === '"'){ cur += '"'; i++; }
        else inQuotes = false;
      } else cur += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ","){ fields.push(cur); cur = ""; }
      else cur += ch;
    }
  }
  fields.push(cur);
  return fields.map(f => f.trim());
}

/* Amount strings: strip RM, spaces, thousands commas. Returns null if not a valid positive number. */
function parseAmount(raw){
  let s = String(raw).replace(/rm/gi, "").replace(/\s/g, "").replace(/,(?=\d{3}(\D|$))/g, "");
  if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
  const n = Number(s);
  if (!isFinite(n) || n <= 0) return null;
  return Math.abs(n);
}

/* Dates: YYYY-MM-DD or DD/MM/YYYY (Malaysian order). Returns ISO or null. */
function parseDateAny(raw){
  const s = String(raw).trim();
  if (!s) return null;
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m){
    const iso = s;
    const d = utcDate(iso);
    if (isNaN(d.getTime()) || isoOf(d) !== iso) return null;
    return iso;
  }
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m){
    const dd = m[1].padStart(2, "0"), mm = m[2].padStart(2, "0"), yyyy = m[3];
    const iso = yyyy + "-" + mm + "-" + dd;
    const d = utcDate(iso);
    if (isNaN(d.getTime()) || isoOf(d) !== iso) return null;
    return iso;
  }
  return null;
}

/* Parse CSV text -> { rows, skipped, skipReasons: [{line, reason}] } */
let csvRowSeq = 0;
function parseCSV(text){
  const rows = [];
  const skipReasons = [];
  const lines = text.split(/\r?\n/);
  let start = 1;
  if (lines.length && splitCSVLine(lines[0]).join("|").toLowerCase() !== "date|description|amount|type|party|due|paid") start = 0;
  for (let i = start; i < lines.length; i++){
    const raw = lines[i];
    if (!raw.trim()) continue;
    const lineNo = i + 1;
    const c = splitCSVLine(raw);
    const skip = (key, v) => skipReasons.push({ line: lineNo, key, v: v === undefined ? "" : v });
    if (c.length !== 7){ skip("skipWrongCols", String(c.length)); continue; }
    const [date, description, amountS, typeRaw, party, dueRaw, paidRaw] = c;
    if (!description){ skip("skipNoDesc"); continue; }
    if (!party){ skip("skipNoParty"); continue; }
    const amount = parseAmount(amountS);
    if (amount === null){ skip("skipBadAmount", amountS); continue; }
    const type = typeRaw.toLowerCase();
    if (type !== "in" && type !== "out"){ skip("skipBadType", typeRaw); continue; }
    const due = parseDateAny(dueRaw);
    if (!due){ skip("skipBadDue", dueRaw); continue; }
    let paid = "";
    if (paidRaw !== ""){
      paid = parseDateAny(paidRaw);
      if (!paid){ skip("skipBadPaid", paidRaw); continue; }
    }
    rows.push({ _id: "csv" + (csvRowSeq++), date, description, amount, type, party, due, paid });
  }
  return { rows, skipped: skipReasons.length, skipReasons };
}

/* Customer habits: averages from paid invoices */
function computeHabits(rows){
  const overall = { sum: 0, count: 0 };
  const byCustomer = {};
  for (const r of rows){
    if (r.type !== "in" || r.paid === "") continue;
    const late = Math.max(0, dayDiff(r.paid, r.due));
    overall.sum += late; overall.count++;
    if (!byCustomer[r.party]) byCustomer[r.party] = { sum: 0, count: 0 };
    byCustomer[r.party].sum += late; byCustomer[r.party].count++;
  }
  const overallAvg = overall.count ? Math.round(overall.sum / overall.count) : 0;
  const habits = {};
  for (const party in byCustomer){
    const h = byCustomer[party];
    habits[party] = {
      paidCount: h.count,
      avgDays: Math.round(h.sum / h.count),
      label: "history"
    };
  }
  return { habits, overallAvg };
}

function customerAvg(habits, overallAvg, party){
  const h = habits[party];
  if (h) return { avg: h.avgDays, noHistory: false };
  return { avg: overallAvg, noHistory: true };
}

/* Monday of the week containing a date (UTC) */
function mondayOf(s){
  const d = utcDate(s);
  const offset = (d.getUTCDay() + 6) % 7;
  return isoOf(new Date(d.getTime() - offset * 86400000));
}

/* Main computation */
function computeAll(rows, startBalance, buffer, today, whatIf){
  const open = [];
  const history = [];
  for (const r of rows){
    if (r.paid === "") open.push(r); else history.push(r);
  }
  const { habits, overallAvg } = computeHabits(rows);

  /* realistic arrivals */
  const arrivals = {};       // row key -> date
  const overdue = {};        // row key -> bool
  for (const r of open){
    const key = r._id;
    if (r.type === "in"){
      const { avg } = customerAvg(habits, overallAvg, r.party);
      let arrival = addDays(r.due, avg);
      if (arrival < today) arrival = today;
      arrivals[key] = arrival;
      overdue[key] = r.due < today;
    } else {
      let arrival = r.due;
      if (arrival < today) arrival = today;
      arrivals[key] = arrival;
      overdue[key] = r.due < today;
    }
  }

  /* what-if override (in only) */
  let whatIfRow = null;
  if (whatIf && whatIf.rowId){
    const r = open.find(x => x._id === whatIf.rowId);
    if (r && r.type === "in"){
      whatIfRow = r;
      let arrival = whatIf.date;
      if (arrival < today) arrival = today;
      arrivals[r._id] = arrival;
      overdue[r._id] = r.due < today;
    }
  }

  /* total owed */
  let totalOwed = 0;
  for (const r of open) if (r.type === "in") totalOwed += r.amount;

  /* weeks */
  const week1Start = mondayOf(today);
  const weekStarts = [];
  for (let i = 0; i < 8; i++) weekStarts.push(addDays(week1Start, i * 7));
  function weekIndexOf(date){
    const idx = Math.floor(dayDiff(date, week1Start) / 7);
    return idx;
  }

  /* per-week buckets, realistic and due-date */
  function buildSeries(useDueDates){
    const weeks = [];
    for (let i = 0; i < 8; i++){
      weeks.push({ start: weekStarts[i], in: 0, out: 0, items: [] });
    }
    for (const r of open){
      let land;
      if (r.type === "in"){
        land = useDueDates ? (r.due < today ? today : r.due) : arrivals[r._id];
      } else {
        land = useDueDates ? (r.due < today ? today : r.due) : arrivals[r._id];
      }
      const idx = weekIndexOf(land);
      if (idx >= 0 && idx < 8){
        if (r.type === "in") weeks[idx].in += r.amount;
        else weeks[idx].out += r.amount;
        weeks[idx].items.push(r);
      }
    }
    let bal = startBalance;
    for (const w of weeks){
      w.net = w.in - w.out;
      bal += w.net;
      w.closing = bal;
    }
    return weeks;
  }

  const realisticWeeks = buildSeries(false);
  const dueWeeks = buildSeries(true);

  /* short weeks */
  const shortWeeks = [];
  realisticWeeks.forEach((w, i) => { if (w.closing < buffer) shortWeeks.push({ index: i, week: w }); });
  const firstShort = shortWeeks.length ? shortWeeks[0] : null;

  /* lowest balance */
  let lowestIdx = 0;
  realisticWeeks.forEach((w, i) => { if (w.closing < realisticWeeks[lowestIdx].closing) lowestIdx = i; });
  let dueLowestIdx = 0;
  dueWeeks.forEach((w, i) => { if (w.closing < dueWeeks[dueLowestIdx].closing) dueLowestIdx = i; });

  /* chase list */
  const openIn = open.filter(r => r.type === "in");
  let chase = [];
  if (firstShort){
    const sundayEnd = addDays(firstShort.week.start, 6);
    const late = openIn.filter(r => arrivals[r._id] > sundayEnd)
      .sort((a, b) => b.amount - a.amount)
      .map(r => ({ row: r, arrival: arrivals[r._id], tooLate: true }));
    const rest = openIn.filter(r => arrivals[r._id] <= sundayEnd)
      .sort((a, b) => b.amount - a.amount)
      .map(r => ({ row: r, arrival: arrivals[r._id], tooLate: false }));
    chase = late.concat(rest);
  } else {
    chase = openIn.slice().sort((a, b) => b.amount - a.amount)
      .map(r => ({ row: r, arrival: arrivals[r._id], tooLate: false }));
  }

  /* slowest payer */
  let slowest = null;
  for (const party in habits){
    if (!slowest || habits[party].avgDays > slowest.avgDays){
      slowest = { party, avgDays: habits[party].avgDays };
    }
  }

  return {
    open, openIn, habits, overallAvg, arrivals, overdue,
    weekStarts, realisticWeeks, dueWeeks,
    shortWeeks, firstShort,
    lowestIdx, dueLowestIdx,
    totalOwed, chase, slowest, whatIfRow
  };
}

/* Templated AI summary (3 lines) */
function buildTemplatedSummary(res, balance, buffer, today, lang){
  const t = TEXT[lang];
  const rw = res.realisticWeeks[res.lowestIdx];
  const dw = res.dueWeeks[res.dueLowestIdx];
  const line1 = t.sum1.replace("{real}", fmtMoney(rw.closing))
    .replace("{week}", fmtDateShort(rw.start))
    .replace("{due}", fmtMoney(dw.closing));
  let line2;
  if (res.shortWeeks.length === 0) line2 = t.sum2none;
  else if (res.shortWeeks.length === 1) line2 = t.weekBelow;
  else line2 = t.weeksBelow.replace("{n}", String(res.shortWeeks.length));
  let line3 = null;
  if (res.chase.length){
    const top = res.chase[0];
    const c = customerAvg(res.habits, res.overallAvg, top.row.party);
    line3 = t.sum3.replace("{party}", top.row.party)
      .replace("{amount}", fmtMoney(top.row.amount))
      .replace("{avg}", String(c.avg));
  }
  return [line1, line2, line3].filter(Boolean);
}

  check("10b first short start", "2026-12-14", res.firstShort ? res.firstShort.week.start : "none");
  check("10c lowest realistic", -5700, res.realisticWeeks[res.lowestIdx].closing);

  const top = res.chase[0];
  check("11b top chase", "Syarikat Maju Bina,48000", top ? top.row.party + "," + top.row.amount : "none");

    wiRes.realisticWeeks.map(w => w.closing).join(","));
  check("12b what-if short weeks", 0, wiRes.shortWeeks.length);
  return checks;
}

<script>
/* ============================================================
   UI (all numbers come from the engine above; nothing here calculates money)
   ============================================================ */
let lang = "en";
let rows = [];
let skipReasons = [];
let whatIf = null;
let chart = null;
let rowSeq = 0;
let isDemo = false;
let importMode = "add";
const hidden ={ real: false, due: false, buffer: false, in: false, out: false };

function t(key){ return TEXT[lang][key]; }
function el(id){ return document.getElementById(id); }
function icon(id, cls){ return '<svg class="i' + (cls ? " " + cls : "") + '" aria-hidden="true"><use href="#' + id + '"/></svg>'; }

/* Money boxes are plain text (no up/down arrows): "25000", "25,000" and "RM 25,000.50" all read the same. */
function moneyValue(s){
  const n = Number(String(s || "").replace(/rm/gi, "").replace(/[\s,]/g, ""));
  return isFinite(n) ? n : 0;
}
function moneyText(n){ const cents = Math.round(n * 100) % 100 !== 0; return n.toLocaleString("en-US", { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: 2 }); }
function getInputs(){
  return {
    balance: moneyValue(el("inpBalance").value),
    buffer: moneyValue(el("inpBuffer").value),
    today: isValidDateStr(el("inpToday").value) ? el("inpToday").value : "2026-11-17"
  };
}

function loadDemo(){
  const { rows: parsed } = parseCSV(DEMO_CSV);
  rows = parsed.map(r => Object.assign({}, r));
  skipReasons = [];
  whatIf = null;
  isDemo = true;
  hideStatus();
  el("inpBalance").value = "30,000";
  el("inpBuffer").value = "5,000";
  el("inpToday").value = "2026-11-17";
  renderAll();
}

function localISO(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function rowIsValid(r){
  if (parseAmount(r.amount) === null) return false;
  if (!r.description || !r.party) return false;
  const ty = String(r.type).toLowerCase();
  if (ty !== "in" && ty !== "out") return false;
  if (!parseDateAny(r.due)) return false;
  if (r.paid !== "" && !parseDateAny(r.paid)) return false;
  return true;
}
function validRows(){
  const out = [];
  for (const r of rows){
    if (!rowIsValid(r)) continue;
    out.push({ _id: r._id, date: r.date, description: r.description, amount: parseAmount(r.amount),
      type: String(r.type).toLowerCase(), party: r.party, due: parseDateAny(r.due),
      paid: r.paid === "" ? "" : parseDateAny(r.paid) });
  }
  return out;
}

/* ---- transactions table ---- */
const COLS = ["date","description","amount","type","party","due","paid"];
function renderTxTable(){
  el("txHead").innerHTML = ["colDate","colDesc","colAmount","colType","colParty","colDue","colPaid","colDelete"]
    .map(k => "<th>" + esc(t(k)) + "</th>").join("");
  const body = el("txBody");
  if (!rows.length){
    body.innerHTML = '<tr><td colspan="8" class="empty">' + esc(t("emptyState")) +
      ' <button class="btn sm primary" type="button" data-demo="1">' + esc(t("loadDemo")) + "</button></td></tr>";
    return;
  }
  body.innerHTML = rows.map((r, i) => "<tr>" + COLS.map(c => {
    const v = r[c] === undefined ? "" : r[c];
    if (c === "type"){
      const ty = String(v).toLowerCase();
      return '<td><select data-i="' + i + '" data-c="type" aria-label="' + esc(t("colType")) + '">' +
        '<option value="in"' + (ty === "in" ? " selected" : "") + ">in</option>" +
        '<option value="out"' + (ty === "out" ? " selected" : "") + ">out</option></select></td>";
    }
    return '<td><input class="' + (c === "description" || c === "party" ? "wide" : "") + '" value="' + esc(v) +
      '" data-i="' + i + '" data-c="' + c + '" aria-label="' + esc(t({date:"colDate",description:"colDesc",amount:"colAmount",party:"colParty",due:"colDue",paid:"colPaid"}[c])) + '"></td>';
  }).join("") +
    '<td><button class="btn icon ghost" type="button" data-del="' + i + '" aria-label="' + esc(t("deleteRow")) + '" title="' + esc(t("deleteRow")) + '">' + icon("ic-trash") + "</button></td></tr>"
  ).join("");
}
function onCellEdit(e){
  const i = e.target.getAttribute("data-i"), c = e.target.getAttribute("data-c");
  if (i !== null && c){ rows[Number(i)][c] = e.target.value; renderAll({ skipTxTable: true }); }
}
el("txBody").addEventListener("input", onCellEdit);
el("txBody").addEventListener("change", e => { if (e.target.tagName === "SELECT") onCellEdit(e); });
el("txBody").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.hasAttribute("data-demo")){ loadDemo(); return; }
  const del = b.getAttribute("data-del");
  if (del !== null){
    const removed = rows.splice(Number(del), 1);
    if (whatIf && removed.some(r => r._id === whatIf.rowId)) whatIf = null;
    renderAll();
  }
});

/* ============================================================
   TEMPLATE, UPLOAD AND MERGE
   ============================================================ */
const TPL_HEAD = ["date","description","amount","type","party","due","paid"];

const isExampleRow = desc => /^\s*(example|contoh)\s*[-:]/i.test(String(desc || ""));

let xlsxPromise = null;
function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxPromise) xlsxPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => window.XLSX ? resolve(window.XLSX) : reject(new Error("xlsx"));
    s.onerror = () => { xlsxPromise = null; reject(new Error("xlsx")); };
    document.head.appendChild(s);
  });
  return xlsxPromise;
}
function csvCell(v){ const s = String(v == null ? "" : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function toCSV(aoa){ return aoa.map(r => r.map(csvCell).join(",")).join("\r\n"); }
function saveBlob(blob, name){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function downloadCsvTemplate(){
  saveBlob(new Blob(["﻿" + toCSV([TPL_HEAD].concat(TPL_EXAMPLES))], { type: "text/csv;charset=utf-8" }), "cashsight-template.csv");
}
async function downloadTemplate(){
  try {
    const X = await loadXLSX();
    const wb = X.utils.book_new();
    const ws = X.utils.aoa_to_sheet([TPL_HEAD].concat(TPL_EXAMPLES));
    ws["!cols"] = [{ wch: 12 }, { wch: 34 }, { wch: 12 }, { wch: 8 }, { wch: 26 }, { wch: 12 }, { wch: 12 }];
    ws["!autofilter"] = { ref: "A1:G1" };
    const help = X.utils.aoa_to_sheet(TPL_HELP);
    help["!cols"] = [{ wch: 12 }, { wch: 70 }, { wch: 60 }];
    X.utils.book_append_sheet(wb, ws, "Cashflow");
    X.utils.book_append_sheet(wb, help, "How to fill");
    X.writeFile(wb, "cashsight-template.xlsx");
  } catch(e){
    downloadCsvTemplate();
  }
}

/* An Excel sheet becomes CSV text, so it goes through exactly the same checks as a CSV file. */
function isoFromDate(d){
  const x = new Date(d.getTime() + 12 * 3600000);   /* noon guards against time-zone edges */
  return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
}
async function xlsxToCSV(buf){
  const X = await loadXLSX();
  const wb = X.read(buf, { type: "array", cellDates: true });
  const name = wb.SheetNames.find(n => n.toLowerCase() === "cashflow") || wb.SheetNames[0];
  const aoa = X.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: "" });
  const clean = aoa.filter(r => r.some(c => String(c).trim() !== ""))
    .map(r => r.slice(0, 7).map(c => c instanceof Date ? isoFromDate(c) : typeof c === "number" ? String(c) : String(c).trim()));
  return toCSV(clean.map(r => { while (r.length < 7) r.push(""); return r; }));
}

/* The same invoice is the same type, party, description, amount and due date (case and spaces ignored). */
const normText = s => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
function rowKey(r){
  return [String(r.type).toLowerCase(), normText(r.party), normText(r.description), parseAmount(r.amount), parseDateAny(r.due)].join("|");
}
function mergeRows(incoming, replace){
  const stats = { added: 0, dup: 0, updated: 0, examples: 0 };
  const base = replace ? [] : rows.slice();
  const index = new Map();
  base.forEach(r => { if (rowIsValid(r)) index.set(rowKey(r), r); });
  for (const r of incoming){
    if (isExampleRow(r.description)){ stats.examples++; continue; }
    const k = rowKey(r);
    const have = index.get(k);
    if (!have){ base.push(r); index.set(k, r); stats.added++; continue; }
    const newPaid = r.paid ? parseDateAny(r.paid) : "";
    const oldPaid = have.paid ? parseDateAny(have.paid) : "";
    if (newPaid && newPaid !== oldPaid){ have.paid = newPaid; stats.updated++; }
    else stats.dup++;
  }
  return { merged: base, stats };
}

function importText(text, fileName){
  const { rows: parsed, skipReasons: reasons } = parseCSV(text);
  const replace = isDemo || importMode === "replace";
  const wasDemo = isDemo;
  const { merged, stats } = mergeRows(parsed, replace);
  rows = merged; skipReasons = reasons; whatIf = null; isDemo = false;
  if (wasDemo){
    /* your own data starts from today and your own bank balance, not the sample's */
    el("inpToday").value = localISO(new Date());
    el("inpBalance").value = "";
  }
  renderAll();
  lastStatus = () => showImportStatus(fileName, stats, reasons.length, wasDemo);
  lastStatus();
  if (reasons.length) openDataPanel();
  if (el("inpBalance").value.trim() === ""){
    el("startCard").scrollIntoView({ behavior: "smooth", block: "center" });
    setTimeout(() => el("inpBalance").focus({ preventScroll: true }), 300);
  }
}
async function importFile(file){
  if (!file) return;
  const name = file.name || "file";
  try {
    let text;
    if (/\.(xlsx|xls)$/i.test(name)){
      try { text = await xlsxToCSV(await file.arrayBuffer()); }
      catch(e){ lastStatus = () => showStatus("err", t("stFailed").replace("{file}", name), esc(t("xlsxFail"))); lastStatus(); return; }
    } else {
      text = await file.text();
    }
    if (!text.trim()) throw new Error("empty");
    importText(text, name);
  } catch(e){
    lastStatus = () => showStatus("err", t("stFailed").replace("{file}", name), esc(t("stFailHelp"))); lastStatus();
  }
}

function showImportStatus(file, st, bad, wasDemo){
  const chip = (n, k) => n ? '<span class="chip"><b>' + n + "</b> " + esc(t(k)) + "</span>" : "";
  const anything = st.added || st.updated;
  const unreadable = !anything && !st.dup && !st.examples && bad;
  const title = (anything ? t("stImported") : unreadable ? t("stFailed") : t("stNothing")).replace("{file}", file);
  if (unreadable){ showStatus("err", title, esc(t("stFailHelp")) + chip(bad, "stBad")); return; }
  const html = chip(st.added, "stAdded") + chip(st.updated, "stUpdated") + chip(st.dup, "stDup") + chip(bad, "stBad") + chip(st.examples, "stEx") +
    (wasDemo ? '<span class="chip">' + esc(t("stReplaced")) + "</span>" : "");
  showStatus(bad && !anything ? "err" : "ok", title, html);
}

function renderCards(res, inp){
  if (res.pending){
    ["card1","card2"].forEach(id => { el(id).textContent = "–"; el(id).classList.remove("neg"); });
    el("card1sub").textContent = t("pendingSub"); el("card2sub").textContent = t("pendingSub");
    el("card3").textContent = fmtMoney(res.totalOwed);
    el("card3sub").textContent = t("card3sub").replace("{n}", String(res.openIn.length));
    if (res.slowest){ el("card4").textContent = t("card4big").replace("{d}", String(res.slowest.avgDays)); el("card4sub").textContent = res.slowest.party; }
    else { el("card4").textContent = "–"; el("card4sub").textContent = ""; }
    return;
  }
  const lw = res.realisticWeeks[res.lowestIdx];
  const dw = res.dueWeeks[res.dueLowestIdx];
  const c1 = el("card1");
  c1.textContent = fmtMoney(lw.closing);
  c1.classList.toggle("neg", lw.closing < 0);
  el("card1sub").textContent = t("card1week").replace("{w}", fmtDateShort(lw.start)) + " · " + t("dueDatesSay").replace("{v}", fmtMoney(dw.closing));
  el("card2").textContent = String(res.shortWeeks.length);
  el("card2").classList.toggle("neg", res.shortWeeks.length > 0);
  el("card2sub").textContent = t("card2sub").replace("{buffer}", fmtMoney(inp.buffer));
  el("card3").textContent = fmtMoney(res.totalOwed);
  el("card3sub").textContent = t("card3sub").replace("{n}", String(res.openIn.length));
  if (res.slowest){
    el("card4").textContent = t("card4big").replace("{d}", String(res.slowest.avgDays));
    el("card4sub").textContent = t("card4sub").replace("{party}", res.slowest.party);
  } else { el("card4").textContent = "–"; el("card4sub").textContent = ""; }
}

let showAllWarnings = false;
function renderWarnings(res, inp){
  const box = el("warnings");
  if (res.pending){ box.innerHTML = '<div class="warning info">' + icon("ic-info") + "<span>" + esc(t("pendingWarn")) + "</span></div>"; return; }
  if (!res.shortWeeks.length){
    box.innerHTML = '<div class="warning ok">' + icon("ic-check") + "<span>" + esc(t("noShortWeeks")) + "</span></div>";
    return;
  }
  const list = showAllWarnings ? res.shortWeeks : res.shortWeeks.slice(0, 1);
  const more = res.shortWeeks.length - list.length;
  box.innerHTML = list.map(({ index, week }) => {
    const w = res.realisticWeeks[index];
    let biggestOut = null;
    for (const r of w.items) if (r.type === "out" && (!biggestOut || r.amount > biggestOut.amount)) biggestOut = r;
    const top = res.chase[0];
    let s;
    if (biggestOut && top){
      s = t("warnFull").replace("{week}", fmtDateShort(week.start)).replace("{closing}", fmtMoney(w.closing))
        .replace("{desc}", biggestOut.description).replace("{amount}", fmtMoney(biggestOut.amount))
        .replace("{date}", fmtDateShort(res.arrivals[biggestOut._id])).replace("{party}", top.row.party)
        .replace("{invAmount}", fmtMoney(top.row.amount)).replace("{due}", fmtDateShort(top.row.due))
        .replace("{arrival}", fmtDateShort(top.arrival));
    } else {
      s = t("warnShort").replace("{week}", fmtDateShort(week.start)).replace("{closing}", fmtMoney(w.closing)).replace("{buffer}", fmtMoney(inp.buffer));
    }
    return '<div class="warning">' + icon("ic-alert") + "<span>" + esc(s) + "</span></div>";
  }).join("") + (res.shortWeeks.length > 1 ? '<button class="btn sm ghost more" type="button" id="btnMoreWarn">' +
    esc(showAllWarnings ? t("warnLess") : t("warnMore").replace("{n}", String(more))) + "</button>" : "");
}

const SERIES = [

function renderChart(res, inp){
  const fallback = el("chartFallback");
  const C = {
    grid: cssVar("--chart-grid"), tick: cssVar("--chart-tick"), text: cssVar("--text"), muted: cssVar("--muted"),
    card: cssVar("--card"), border: cssVar("--border-strong"), inBar: cssVar("--chart-in"), outBar: cssVar("--chart-out"),
    real: cssVar("--chart-real"), realFill: cssVar("--chart-real-fill"), due: cssVar("--chart-due"),
    buffer: cssVar("--chart-buffer"), belowZero: cssVar("--chart-belowzero")
  };
  renderLegend(C);
  if (typeof Chart === "undefined"){
    el("chartBox").style.display = "none"; el("legend").style.display = "none";
    fallback.style.display = "block"; fallback.textContent = t("chartFail");
    return;
  }
  el("chartBox").style.display = "block"; fallback.style.display = "none";
  if (chart) chart.destroy();
  const rm = v => (v < 0 ? "-RM " : "RM ") + Math.abs(Math.round(v)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const rmShort = v => { const a = Math.abs(v); const s = a >= 1000 ? (a / 1000).toLocaleString("en-US", { maximumFractionDigits: 0 }) + "k" : String(a); return (v < 0 ? "-RM " : "RM ") + s; };
  const belowZero = { id: "belowZero", beforeDatasetsDraw(c){
    const { ctx, chartArea: a, scales: { y } } = c; if (!a) return;
    const zero = y.getPixelForValue(0);
    if (zero < a.bottom){ ctx.save(); ctx.fillStyle = C.belowZero; const top = Math.max(zero, a.top); ctx.fillRect(a.left, top, a.right - a.left, a.bottom - top); ctx.restore(); }
  } };
  const realFill = (context) => {
    const { chart: c } = context; const a = c.chartArea; if (!a) return C.realFill;
    const g = c.ctx.createLinearGradient(0, a.top, 0, a.bottom);
    g.addColorStop(0, C.realFill); g.addColorStop(1, "rgba(0,0,0,0)"); return g;
  };
  const mobile = window.innerWidth < 600;
  chart = new Chart(el("chart"), {
    type: "bar",
    data: {
      labels: res.weekStarts.map(fmtDateShort),
      datasets: [
        { label: t("legendReal"), data: res.realisticWeeks.map(w => w.closing), type: "line", borderColor: C.real, backgroundColor: realFill,
          fill: "origin", borderWidth: 3, cubicInterpolationMode: "monotone", pointRadius: mobile ? 3 : 4, pointHoverRadius: 6,
          pointBackgroundColor: C.real, pointBorderColor: C.card, pointBorderWidth: 2, order: 1, hidden: hidden.real || res.pending },
        { label: t("legendDue"), data: res.dueWeeks.map(w => w.closing), type: "line", borderColor: C.due, borderWidth: 2.25,
          borderDash: [7, 5], cubicInterpolationMode: "monotone", pointRadius: 0, pointHoverRadius: 4, pointBackgroundColor: C.due, fill: false, order: 2, hidden: hidden.due || res.pending },
        { label: t("legendBuffer"), data: res.weekStarts.map(() => inp.buffer), type: "line", borderColor: C.buffer, borderWidth: 1.75,
          borderDash: [3, 4], pointRadius: 0, pointHoverRadius: 0, fill: false, order: 3, hidden: hidden.buffer },
        { label: t("legendIn"), data: res.realisticWeeks.map(w => w.in), backgroundColor: C.inBar, borderRadius: 5,
          borderSkipped: false, maxBarThickness: 26, categoryPercentage: .62, barPercentage: .9, order: 4, hidden: hidden.in },
        { label: t("legendOut"), data: res.realisticWeeks.map(w => w.out), backgroundColor: C.outBar, borderRadius: 5,
          borderSkipped: false, maxBarThickness: 26, categoryPercentage: .62, barPercentage: .9, order: 5, hidden: hidden.out }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 350 },
      interaction: { mode: "index", intersect: false },
      layout: { padding: { top: 6, right: 4 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: C.card, borderColor: C.border, borderWidth: 1, titleColor: C.text, bodyColor: C.text,
          padding: 12, cornerRadius: 10, boxPadding: 6, usePointStyle: true,
          titleFont: { weight: "600" }, bodyFont: { size: 13 },
          callbacks: {
            title: items => (lang === "bm" ? "Minggu " : "Week of ") + items[0].label,
            label: ctx => " " + ctx.dataset.label + ": " + rm(ctx.parsed.y),
            labelPointStyle: ctx => ({ pointStyle: ctx.dataset.type === "line" ? "line" : "rectRounded", rotation: 0 })
          }
        }
      },
      scales: {
        x: { grid: { display: false }, border: { display: false }, ticks: { color: C.tick, font: { size: 12 }, maxRotation: 0, autoSkip: true } },
        y: { grid: { color: C.grid }, border: { display: false },
             ticks: { color: C.tick, font: { size: 12 }, padding: 8, maxTicksLimit: 7, callback: v => mobile ? rmShort(v) : rm(v) } }
      }
    },
    plugins: [belowZero]
  });
}

/* ---- theme ---- */
function currentTheme(){ return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  try { localStorage.setItem("cashsight.theme", theme); } catch(e){}
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "dark" ? "#0B0E13" : "#F5F6F8");
  setPressed("btnLight", "btnDark", theme === "light");
  if (window._lastRes) renderChart(window._lastRes, getInputs());
}
el("btnLight").addEventListener("click", () => applyTheme("light"));
el("btnDark").addEventListener("click", () => applyTheme("dark"));

/* ---- weekly table ---- */
function renderWeekTable(res){
  el("weekHead").innerHTML = [["hWeek",""],["hIn","right"],["hOut","right"],["hNet","right"],["hCloseReal","right"],["hCloseDue","right"]]
    .map(([k, c]) => '<th class="' + c + '">' + esc(t(k)) + "</th>").join("");
  const shortIdx = new Set(res.shortWeeks.map(s => s.index));
  const m = v => '<td class="right' + (v < 0 ? " neg" : "") + '"' + (v < 0 ? ' style="font-weight:700"' : "") + ">" + fmtMoney(v) + "</td>";
  el("weekBody").innerHTML = res.realisticWeeks.map((w, i) =>
    "<tr" + (shortIdx.has(i) ? ' class="short"' : "") + "><td>" + fmtDateShort(w.start) + "</td>" +
    '<td class="right">' + fmtMoney(w.in) + "</td>" + '<td class="right">' + fmtMoney(w.out) + "</td>" +
    m(w.net) + (res.pending ? '<td class="right muted">–</td><td class="right muted">–</td>' : m(w.closing) + m(res.dueWeeks[i].closing)) + "</tr>").join("");
}

/* ---- what-if ---- */
function previewWhatIf(){
  const box = el("wiPreview");
  const res = window._lastRes; if (!res) return;
  const id = el("wiSelect").value, date = el("wiDate").value;
  if (!id || !isValidDateStr(date)){ box.textContent = t("wiPick"); return; }
  if (res.pending){ box.textContent = t("pendingSub"); return; }
  const inp = getInputs();
  const base = computeAll(validRows(), inp.balance, inp.buffer, inp.today, null);
  const alt = computeAll(validRows(), inp.balance, inp.buffer, inp.today, { rowId: id, date });
  const from = base.realisticWeeks[base.lowestIdx].closing, to = alt.realisticWeeks[alt.lowestIdx].closing;
  const n = alt.shortWeeks.length;
  const nTxt = n === 0 ? t("wiShort0") : n === 1 ? t("wiShort1") : t("wiShortN").replace("{n}", String(n));
  const cls = to > from ? "up" : to < from ? "down" : "";
  box.innerHTML = esc(t("wiPreview").replace("{date}", fmtDateShort(date)).replace("{n}", nTxt))
    .replace("{from}", "<b>" + esc(fmtMoney(from)) + "</b>")
    .replace("{to}", '<span class="' + cls + '">' + esc(fmtMoney(to)) + "</span>");
}
function renderWhatIf(res){
  const sel = el("wiSelect");
  const prev = whatIf ? whatIf.rowId : sel.value;
  if (!res.openIn.length){
    sel.innerHTML = '<option value="">–</option>'; el("wiDate").value = "";
  } else {
    sel.innerHTML = res.openIn.map(r => '<option value="' + esc(r._id) + '">' + esc(r.party + " · " + fmtMoney(r.amount) + " · " + t("dueWord") + " " + fmtDateShort(r.due)) + "</option>").join("");
    if (whatIf) sel.value = whatIf.rowId;
    else if (prev && res.openIn.some(r => r._id === prev)) sel.value = prev;
    const r0 = res.openIn.find(r => r._id === sel.value) || res.openIn[0];
    el("wiDate").value = whatIf && whatIf.rowId === sel.value ? whatIf.date : r0.due;
  }
  el("whatifTag").textContent = t("wiTag");
  el("whatifTag").classList.toggle("on", !!whatIf);
  el("btnWiReset").disabled = !whatIf;
  previewWhatIf();
}
el("btnWiApply").addEventListener("click", () => {
  const id = el("wiSelect").value, date = el("wiDate").value;
  if (id && isValidDateStr(date)){ whatIf = { rowId: id, date }; renderAll(); }
});
el("btnWiReset").addEventListener("click", () => { whatIf = null; renderAll(); });
el("wiSelect").addEventListener("change", () => {
  const r = window._lastRes.openIn.find(x => x._id === el("wiSelect").value);
  if (r && !(whatIf && whatIf.rowId === el("wiSelect").value)) el("wiDate").value = r.due;
  previewWhatIf();
});
el("wiDate").addEventListener("input", previewWhatIf);

/* ---- chase list ---- */
function renderChase(res){
  const box = el("chaseList");
  if (!res.chase.length){ box.innerHTML = '<div class="empty">' + esc(t("nothingToChase")) + "</div>"; return; }
  const sep = '<span class="sep">·</span>';
  box.innerHTML = res.chase.map((item, i) => {
    const r = item.row;
    const c = customerAvg(res.habits, res.overallAvg, r.party);
    let tags = "";
    if (item.tooLate) tags += '<span class="tag red">' + esc(t("tagTooLate")) + "</span>";
    if (res.overdue[r._id]) tags += '<span class="tag">' + esc(t("tagOverdue")) + "</span>";
    const avgText = c.noHistory ? t("noHistory") : t("avgLate").replace("{d}", String(c.avg));
    return '<div class="chase-item"><div style="display:flex;gap:12px;align-items:flex-start;min-width:0">' +
      '<span class="rank">' + (i + 1) + "</span><div style=\"min-width:0\">" +
      '<div class="chase-top"><strong>' + esc(r.party) + '</strong><span class="amt num">' + fmtMoney(r.amount) + "</span>" + tags + "</div>" +
      '<div class="chase-meta">' + esc(r.description) + sep + esc(t("dueWord")) + " " + fmtDateShort(r.due) + sep +
      esc(t("expected")) + " " + fmtDateShort(item.arrival) + sep + esc(avgText) + "</div></div></div>" +
      '<button class="btn sm" type="button" data-chase="' + i + '">' + icon("ic-copy") + "<span>" + esc(t("copyReminder")) + "</span></button></div>";
  }).join("");
}
el("chaseList").addEventListener("click", e => {
  const b = e.target.closest("button[data-chase]"); if (!b) return;
  const item = window._lastRes.chase[Number(b.getAttribute("data-chase"))];
  const inp = getInputs(); const r = item.row;
  const overdue = r.due < inp.today;
  const key = lang === "bm" ? (overdue ? "reminderDuePastBM" : "reminderDueFutureBM") : (overdue ? "reminderDuePast" : "reminderDueFuture");
  const msg = t(key).replace("{party}", r.party).replace("{desc}", r.description).replace("{amount}", fmtMoney(r.amount))
    .replace("{due}", fmtDateShort(r.due)).replace("{payBy}", fmtDateShort(addDays(inp.today, 3)));
  copyToClipboard(msg, b);
});
function copyToClipboard(text, btn){
  const done = () => {
    const html = btn.innerHTML;
    btn.classList.add("done"); btn.innerHTML = icon("ic-check") + "<span>" + esc(t("copied")) + "</span>";
    setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = html; }, 1800);
  };
  const fallback = () => { el("clipboardBox").style.display = "block"; el("clipboardText").value = text; el("clipboardText").select(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}

/* ---- habits ---- */
function renderHabits(res){
  el("habitHead").innerHTML = [["colParty",""],["hCount","right"],["hAvg","right"],["hLabel",""]].map(([k, c]) => '<th class="' + c + '">' + esc(t(k)) + "</th>").join("");
  const parties = Object.keys(res.habits);
  const seen = new Set(parties);
  for (const r of res.openIn) if (!seen.has(r.party)){ seen.add(r.party); parties.push(r.party); }
  parties.sort();
  el("habitBody").innerHTML = parties.map(p => {
    const c = customerAvg(res.habits, res.overallAvg, p); const h = res.habits[p];
    const label = c.noHistory ? t("noHistory") : (h.avgDays <= 0 ? t("labelHistory") : t("labelLate"));
    const tag = c.noHistory ? '<span class="tag">' + esc(label) + "</span>" : h.avgDays > 14 ? '<span class="tag red">' + esc(label) + "</span>" : esc(label);
    return "<tr><td>" + esc(p) + '</td><td class="right">' + (h ? h.paidCount : 0) + '</td><td class="right">' + c.avg + "</td><td>" + tag + "</td></tr>";
  }).join("");
}

/* ---- summary (templated from computed numbers; optional AI host hook) ---- */
let aiTimer = null;
function renderAISummary(res, inp){
  const lines = buildTemplatedSummary(res, inp.balance, inp.buffer, inp.today, lang);
  const card = el("aiSummaryCard"), box = el("aiSummary");
  card.classList.toggle("pending", !!res.pending);
  if (res.pending){
    card.classList.remove("bad");
    el("sumBadge").innerHTML = icon("ic-info");
    box.innerHTML = '<p class="line">' + esc(t("pendingTitle")) + '</p><p class="line">' + esc(t("pendingText")) + "</p>";
    return;
  }
  const bad = res.shortWeeks.length > 0;
  card.classList.toggle("bad", bad);
  el("sumBadge").innerHTML = icon(bad ? "ic-alert" : "ic-check");
  const from = t("fromLine").replace("{bal}", fmtMoney(inp.balance)).replace("{date}", fmtDateShort(inp.today));
  box.innerHTML = '<p class="line">' + esc(lines[0]) + '</p><p class="line lines-rest">' + lines.slice(1).map(esc).join(" · ") + "</p>" +
    '<div class="note">' + esc(from) + " · " + esc(t("aiNote")) + "</div>";
  if (typeof window.CASHSIGHT_AI_PROVIDER !== "function") return;
  const payload = {
    language: lang,
    lowest_realistic: { amount: res.realisticWeeks[res.lowestIdx].closing, week_start: res.realisticWeeks[res.lowestIdx].start },
    lowest_due_dates: { amount: res.dueWeeks[res.dueLowestIdx].closing, week_start: res.dueWeeks[res.dueLowestIdx].start },
    short_weeks: res.shortWeeks.map(s => ({ week_start: s.week.start, closing: s.week.closing })),
    short_week_count: res.shortWeeks.length,
    top_chase: res.chase.length ? { party: res.chase[0].row.party, amount: res.chase[0].row.amount, avg_days_late: customerAvg(res.habits, res.overallAvg, res.chase[0].row.party).avg } : null,
    slowest_payer: res.slowest, total_owed: res.totalOwed
  };
  const instruction = "Use only the numbers in this JSON. Do not calculate, round, change or add any number. If a number is not in the JSON, do not mention it. Answer with exactly 3 short lines in the chosen language for a busy owner.";
  Promise.race([ window.CASHSIGHT_AI_PROVIDER(payload, instruction), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 8000)) ])
    .then(answer => { if (typeof answer === "string" && answer.trim()) box.innerHTML = answer.trim().split("\n").map(l => '<p class="line">' + esc(l) + "</p>").join(""); })
    .catch(() => {});
}

["inpBalance","inpBuffer","inpToday"].forEach(id => el(id).addEventListener("input", () => renderAll()));
["inpBalance","inpBuffer"].forEach(id => {
  const box = el(id);
  /* keep only digits, one dot and commas while typing */
  box.addEventListener("beforeinput", e => {
    if (!e.data || !/[^\d.,]/.test(e.data)) return;
    e.preventDefault();                                   /* "RM 45,000.50" pasted becomes 45,000.50 */
    const clean = e.data.replace(/[^\d.,]/g, "");
    if (clean){ box.setRangeText(clean, box.selectionStart, box.selectionEnd, "end"); box.dispatchEvent(new Event("input", { bubbles: true })); }
  });
  /* tidy to 25,000 when leaving the box */
  box.addEventListener("blur", () => { if (box.value.trim() !== ""){ box.value = moneyText(moneyValue(box.value)); renderAll(); } });
});

/* ---- self-test note ---- */
function renderSelfTest(){
  const checks = runSelfTest();
  const failed = checks.filter(c => !c.pass);
  const box = el("selfTest");
  if (!failed.length){
    box.className = "pass";
    box.innerHTML = icon("ic-shield") + "<span>" + esc(t("testPass").replace(/\{n\}/g, String(checks.length))) + "</span>";
  } else {
    box.className = "fail";
    box.textContent = t("testFail") + "\n" + failed.map(c => c.name + " — expected " + c.expected + ", actual " + c.actual).join("\n");
  }
}

/* ---- persistence ---- */
function saveState(){
  try{ localStorage.setItem("cashsight.v1", JSON.stringify({ rows, lang, isDemo, importMode, balance: el("inpBalance").value, buffer: el("inpBuffer").value, today: el("inpToday").value })); }catch(e){}
}
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem("cashsight.v1"));
    if (!s || !Array.isArray(s.rows)) return false;
    rows = s.rows; whatIf = null;
    lang = s.lang === "bm" ? "bm" : "en";
    isDemo = s.isDemo !== false;
    importMode = s.importMode === "replace" ? "replace" : "add";
    el("inpBalance").value = s.balance !== undefined ? s.balance : "30,000";
    el("inpBuffer").value = s.buffer !== undefined ? s.buffer : "5,000";
    el("inpToday").value = s.today || "2026-11-17";
    return true;
  }catch(e){ return false; }
}

/* ---- boot ---- */
if (!loadState()){
  rows = parseCSV(DEMO_CSV).rows; isDemo = true;
  el("inpBalance").value = "30,000"; el("inpBuffer").value = "5,000"; el("inpToday").value = "2026-11-17";
}
const _renderAll = renderAll;
renderAll = function(opts){ _renderAll(opts); saveState(); };
setLang(lang);
renderSelfTest();
/* language also changes the self-test line */
const _setLang = setLang;
setLang = function(l){ _setLang(l); renderSelfTest(); };
window.addEventListener("beforeunload", saveState);
let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (window._lastRes) renderChart(window._lastRes, getInputs()); }, 200); });
</script>
